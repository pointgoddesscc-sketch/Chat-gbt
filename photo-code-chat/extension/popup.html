<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 18px;
      font-family: Arial, sans-serif;
      background: #080914;
      color: white;
    }

    button,
    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
    }

    button {
      background: #72f6ff;
      font-weight: 800;
      cursor: pointer;
    }

    p {
      color: #cdd2ff;
    }
  </style>
</head>
<body>
  <h2>PhotoCode</h2>
  <p>Capture this tab and open it in your converter.</p>

  <input id="domain" placeholder="https://yourdomain.com" />
  <button id="save" type="button">Save Domain</button>
  <button id="capture" type="button">Capture Tab</button>

  <p id="status"></p>

  <script src="./popup.js"></script>
</body>
</html>
